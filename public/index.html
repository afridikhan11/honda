<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honda Islamabad — NextGen</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2307080F'/><text x='50' y='70' font-size='56' text-anchor='middle'>🏍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F4F5FB; --bg-2:#ECEEF7;
    --surface:rgba(255,255,255,.72); --surface-solid:#FFFFFF; --surface-2:#F2F4FB;
    --border:rgba(17,20,45,.09); --border-2:rgba(17,20,45,.06);
    --text:#0C1024; --text-2:#525A73; --text-3:#8B93AC;
    --accent:#E01E2B; --accent-2:#FF5A3C; --accent-ink:#FFFFFF;
    --accent-soft:rgba(224,30,43,.11); --accent-line:rgba(224,30,43,.28);
    --grad:linear-gradient(135deg,#E01E2B 0%,#FF5A3C 100%);
    --grad-soft:linear-gradient(135deg,rgba(224,30,43,.14),rgba(255,90,60,.14));
    --success:#10B981; --success-soft:rgba(16,185,129,.13);
    --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);
    --danger:#EF4444; --danger-soft:rgba(239,68,68,.12);
    --glow:0 8px 30px -8px rgba(224,30,43,.42);
    --sh-sm:0 1px 2px rgba(12,16,36,.05);
    --sh:0 10px 30px -14px rgba(12,16,36,.22);
    --sh-lg:0 40px 80px -24px rgba(12,16,36,.30);
    --blur:saturate(160%) blur(18px);
    --r:20px; --r-md:16px; --r-sm:12px;
    --side:264px;
    --font:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --font-ur:"Noto Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
    --aur1:rgba(224,30,43,.26); --aur2:rgba(255,90,60,.22); --aur3:rgba(255,140,60,.16);
  }
  :root[data-theme="dark"]{
    --bg:#07080F; --bg-2:#0A0C16;
    --surface:rgba(22,25,42,.66); --surface-solid:#141728; --surface-2:#10121F;
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.05);
    --text:#EEF0FA; --text-2:#9BA3BD; --text-3:#646C86;
    --accent:#FF4D4D; --accent-2:#FF7A45; --accent-ink:#FFFFFF;
    --accent-soft:rgba(255,77,77,.16); --accent-line:rgba(255,77,77,.34);
    --grad:linear-gradient(135deg,#FF3B3B 0%,#FF7A45 100%);
    --grad-soft:linear-gradient(135deg,rgba(255,77,77,.20),rgba(255,122,69,.16));
    --success:#34D399; --success-soft:rgba(52,211,153,.15);
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.15);
    --danger:#F87171; --danger-soft:rgba(248,113,113,.15);
    --glow:0 10px 40px -8px rgba(255,77,77,.55);
    --sh-sm:0 1px 2px rgba(0,0,0,.5);
    --sh:0 18px 44px -18px rgba(0,0,0,.7);
    --sh-lg:0 50px 100px -30px rgba(0,0,0,.85);
    --aur1:rgba(255,77,77,.30); --aur2:rgba(255,122,69,.24); --aur3:rgba(255,90,60,.16);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  /* aurora ambience */
  body::before{
    content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(38vw 38vw at 12% 8%,var(--aur1),transparent 60%),
      radial-gradient(34vw 34vw at 92% 4%,var(--aur2),transparent 62%),
      radial-gradient(40vw 40vw at 78% 96%,var(--aur3),transparent 60%);
    filter:blur(28px); opacity:.9; animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{ to{ transform:translate3d(0,-3%,0) scale(1.06) } }
  #loginView,#appView{position:relative;z-index:1}

  html[dir="rtl"] body{font-family:var(--font-ur)}
  button,input,select{font-family:inherit}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px;border:3px solid transparent;background-clip:padding-box}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:var(--r-sm);
    border:1px solid transparent;font-weight:600;font-size:.9rem;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s,filter .2s;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--grad);color:var(--accent-ink);box-shadow:var(--glow)}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:0 14px 44px -8px rgba(124,128,255,.7)}
  .btn-primary:disabled{opacity:.45;box-shadow:none;cursor:default}
  .btn-ghost{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
  .btn-ghost:hover{color:var(--text);border-color:var(--accent-line)}
  .btn-lg{padding:14px 22px;font-size:1rem;border-radius:var(--r-md)}
  .btn-block{width:100%}
  .icon-btn{width:42px;height:42px;padding:0;border-radius:13px;border:1px solid var(--border);
    background:var(--surface);backdrop-filter:var(--blur);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .icon-btn:hover{color:var(--text);border-color:var(--accent-line);transform:translateY(-1px)}
  .icon-btn svg,.nav-item svg,.stat .ic svg,.search svg{width:19px;height:19px}

  /* login */
  .login-wrap{min-height:100%;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
  .login-art{position:absolute;inset:0;z-index:0;pointer-events:none}
  .login-art svg{width:100%;height:100%;display:block}
  .login-art .chip{transform-box:fill-box;transform-origin:center;animation:floaty 7s ease-in-out infinite;filter:drop-shadow(0 6px 16px var(--accent-line))}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .login-top{position:fixed;top:20px;inset-inline-end:20px;display:flex;gap:9px;z-index:3}
  .login-card{position:relative;z-index:1;width:100%;max-width:410px;background:var(--surface);backdrop-filter:var(--blur);
    border:1px solid var(--border);border-radius:26px;box-shadow:var(--sh-lg);padding:38px 34px;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .brand-badge{width:56px;height:56px;border-radius:17px;background:var(--grad);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:800;font-size:1.35rem;box-shadow:var(--glow)}
  .login-card h1{font-size:1.6rem;margin:20px 0 5px;font-weight:800;letter-spacing:-.03em}
  .login-card .sub{color:var(--text-2);font-size:.94rem;margin-bottom:28px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:8px}
  .input{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);
    color:var(--text);font-size:.95rem;transition:.15s}
  .input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .login-foot{margin-top:20px;text-align:center;color:var(--text-3);font-size:.8rem}
  .dev-credit{padding:14px 12px 4px;font-size:.66rem;line-height:1.55;color:var(--text-3);text-align:center;opacity:.75}
  .dev-credit b{color:var(--text-2);font-weight:700}

  /* app shell */
  .app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:70px 1fr;
    grid-template-areas:"side top" "side main";height:100%}
  .sidebar{grid-area:side;margin:14px;margin-inline-end:0;background:var(--surface);backdrop-filter:var(--blur);
    border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
  .topbar{grid-area:top;position:relative;z-index:100;display:flex;align-items:center;gap:14px;padding:0 22px;margin:14px;margin-bottom:0;
    background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:20px}
  .main{grid-area:main;overflow-y:auto;padding:22px}
  .content-max{max-width:1440px;margin:0 auto}
  .content-max.wide{max-width:none;margin:0;height:100%;display:flex;flex-direction:column;align-items:center;min-height:0}   /* POS fills the viewport height (no page scroll) */

  .side-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px}
  .side-brand .bb{width:42px;height:42px;border-radius:13px;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;box-shadow:var(--glow)}
  .side-brand .st{font-weight:800;font-size:1.08rem;letter-spacing:-.02em}
  .side-brand .ss{font-size:.72rem;color:var(--text-3);font-weight:500}
  .nav{padding:8px 14px;display:flex;flex-direction:column;gap:3px}
  .nav-label{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:16px 12px 7px}
  .nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;color:var(--text-2);
    font-weight:500;font-size:.92rem;cursor:pointer;transition:.14s;border:none;background:none;text-align:start;width:100%}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--grad-soft);color:var(--text);font-weight:700}
  .nav-item.active::before{content:"";position:absolute;inset-inline-start:-14px;top:50%;transform:translateY(-50%);
    width:4px;height:22px;border-radius:0 6px 6px 0;background:var(--grad);box-shadow:var(--glow)}
  .nav-item.active svg{color:var(--accent)}
  .nav-item svg{flex:none}
  .nav-spacer{flex:1}

  .tb-title{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
  .tb-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .lang-switch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;gap:3px}
  .lang-switch button{border:none;background:none;padding:7px 12px;border-radius:9px;font-size:.8rem;font-weight:600;color:var(--text-2);cursor:pointer;transition:.14s}
  .lang-switch button.on{background:var(--surface-solid);color:var(--accent);box-shadow:var(--sh-sm)}
  .user-wrap{position:relative}
  .user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);cursor:pointer;transition:.14s;font-family:inherit}
  .user-chip:hover{border-color:var(--accent-line)}
  .uc-txt{text-align:start}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.82rem}
  .user-chip .un{font-size:.82rem;font-weight:700} .user-chip .us{font-size:.68rem;color:var(--text-3)}
  .user-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:70;min-width:180px;background:var(--surface-solid);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-lg);padding:6px;display:none}
  .user-menu.show{display:block;animation:rise .15s both}
  .um-item{display:flex;width:100%;text-align:start;border:none;background:transparent;color:var(--text-2);padding:10px 12px;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
  .um-item:hover{background:var(--surface-2);color:var(--text)}
  .um-item.danger{color:var(--danger)}
  .login-err{color:var(--danger);font-size:.82rem;font-weight:600;text-align:center;margin:-4px 0 12px;display:none}
  .login-err.show{display:block}
  .badge-role{font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:capitalize}
  .badge-role.owner{background:var(--accent-soft);color:var(--accent)}
  .badge-role.cashier{background:var(--surface-2);color:var(--text-2)}

  /* pages */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;animation:rise .5s .02s both}
  .page-head h2{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;margin:0}
  .page-head p{color:var(--text-2);font-size:.9rem;margin:5px 0 0}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
  .stat{position:relative;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--border);
    border-radius:var(--r);padding:20px;overflow:hidden;transition:transform .18s,box-shadow .25s,border-color .25s;
    animation:rise .5s both}
  .stat:nth-child(1){animation-delay:.04s}.stat:nth-child(2){animation-delay:.09s}.stat:nth-child(3){animation-delay:.14s}.stat:nth-child(4){animation-delay:.19s}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--accent-line)}
  .stat::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:120px;height:120px;background:var(--grad-soft);border-radius:50%;filter:blur(8px);opacity:.6}
  .stat .ic{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
  .stat .k{position:relative;font-size:.8rem;color:var(--text-2);font-weight:600}
  .stat .v{position:relative;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-top:4px}
  .stat .d{position:relative;font-size:.76rem;margin-top:7px;font-weight:700}
  .up{color:var(--success)} .down{color:var(--warn)}
  .ic.blue{background:var(--accent-soft);color:var(--accent)}
  .ic.green{background:var(--success-soft);color:var(--success)}
  .ic.amber{background:var(--warn-soft);color:var(--warn)}
  .ic.rose{background:var(--danger-soft);color:var(--danger)}

  .grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
  .grid-2 .card{animation:rise .5s .12s both}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-2)}
  .card-head h3{font-size:1.02rem;font-weight:800;margin:0;letter-spacing:-.01em}
  .card-head a{font-size:.82rem;color:var(--accent);font-weight:700;cursor:pointer}

  table{width:100%;border-collapse:collapse;font-size:.9rem}
  .tbl-wrap{overflow-x:auto}
  th{text-align:start;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;padding:13px 22px;background:var(--surface-2)}
  td{padding:14px 22px;border-top:1px solid var(--border-2)}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:var(--surface-2)}
  .chipstock{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px}
  .chipstock.ok{background:var(--success-soft);color:var(--success)}
  .chipstock.low{background:var(--warn-soft);color:var(--warn)}
  .chipstock.out{background:var(--danger-soft);color:var(--danger)}

  .toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;animation:rise .5s .06s both}
  .search{position:relative;flex:1;min-width:220px}
  .search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--text-3)}
  .search input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--border);border-radius:14px;background:var(--surface);backdrop-filter:var(--blur);color:var(--text);font-size:.92rem;transition:.15s}
  html[dir="rtl"] .search input{padding:13px 44px 13px 16px}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

  /* ===== MODULE-SPECIFIC CSS ===== */
  .picker{position:relative}
  .picker-res{position:absolute;z-index:30;top:calc(100% + 6px);inset-inline:0;background:var(--surface-solid);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-lg);max-height:320px;overflow-y:auto;padding:8px;display:none}
  .cart-tbl td,.cart-tbl th{padding:9px 12px}
  .cart-tbl input{width:80px;padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);text-align:end;font-family:var(--mono)}
  .pos{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
  .totrow{display:flex;justify-content:space-between;padding:7px 0;font-size:.92rem}
  .totrow.big{font-size:1.3rem;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:12px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
  .seg button{border:none;background:none;padding:8px 14px;border-radius:9px;font-size:.84rem;font-weight:700;color:var(--text-2);cursor:pointer}
  .seg button.on{background:var(--surface-solid);color:var(--accent);box-shadow:var(--sh-sm)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .fgrid label{font-size:.78rem;font-weight:600;color:var(--text-2);display:block;margin-bottom:6px}
  @media (max-width:900px){ .pos{grid-template-columns:1fr} }
  .placeholder{display:grid;place-items:center;padding:80px 20px;text-align:center;color:var(--text-3);gap:6px}
  .placeholder svg{width:48px;height:48px;opacity:.4;margin-bottom:8px}
  .badge-soon{font-size:.7rem;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;margin-top:12px}

  .toast{position:fixed;bottom:24px;inset-inline-end:24px;background:var(--grad);color:var(--accent-ink);padding:14px 20px;border-radius:15px;font-weight:700;font-size:.92rem;box-shadow:var(--glow);opacity:0;transform:translateY(14px) scale(.96);transition:.28s cubic-bezier(.2,.9,.3,1.2);z-index:50}
  .toast.show{opacity:1;transform:none}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(6,8,16,.55);backdrop-filter:blur(5px);display:none;place-items:center;z-index:60;padding:20px}
  .modal-back.show{display:grid;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:440px;background:var(--surface-solid);border:1px solid var(--border);border-radius:22px;box-shadow:var(--sh-lg);overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border-2)}
  .modal-h h3{margin:0;font-size:1.12rem;font-weight:800}
  .modal-b{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .modal-b label{font-size:.8rem;font-weight:600;color:var(--text-2);display:block;margin-bottom:7px}
  .modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--border-2);background:var(--surface-2)}
  select.input{appearance:none;cursor:pointer}

  /* receipt / print */
  .receipt-area{display:none}
  @media print{
    body::before{display:none !important}
    #loginView,#appView,.toast,.modal-back{display:none !important}
    .receipt-area{display:block !important;width:280px;margin:0 auto;color:#000;font-family:var(--mono);font-size:12px;line-height:1.5}
    .receipt-area *{color:#000 !important}
    .rc-center{text-align:center}
    .rc-line{border-top:1px dashed #000;margin:7px 0}
    .rc-row{display:flex;justify-content:space-between;gap:10px}
    .rc-shop{font-size:16px;font-weight:700}
  }
  .xclose{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:8px}
  .xclose:hover{background:var(--surface-2);color:var(--text)}
  .lookup-list{max-height:56vh;overflow-y:auto;padding:8px 16px 8px;display:flex;flex-direction:column;gap:5px}
  .lk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:start;transition:.1s;color:var(--text);width:100%}

const API="/api";

let NET=true;
async function cloudAPI(path,method,body){
  const r=await fetch(API+path,{method:method||"GET",headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401){ TOKEN=null; try{localStorage.removeItem("hw_token");}catch(e){} throw new Error("unauthorized"); }
  const j=await r.json().catch(()=>({error:"bad response"}));
  if(!r.ok||j.error){ const e=new Error(j.error||("HTTP "+r.status)); e.hard=(r.status===403); throw e; }
  return j;
}

function queuePush(a){ try{ const q=JSON.parse(localStorage.getItem("hw_queue")||"[]"); q.push(a); localStorage.setItem("hw_queue",JSON.stringify(q)); }catch(e){} }
async function flushQueue(){ let q; try{ q=JSON.parse(localStorage.getItem("hw_queue")||"[]"); }catch(e){ return; } if(!q.length) return; const rest=[]; for(const a of q){ try{ await cloudAPI("/action","POST",a); }catch(e){ if(e.hard){continue;} rest.push(a); } } try{ localStorage.setItem("hw_queue",JSON.stringify(rest)); }catch(e){} }
async function cloudAction(action,payload){
  try{ const r=await cloudAPI("/action","POST",{action,payload}); NET=true; flushQueue(); netPill(); return r; }
  catch(e){
    if(e.message==="unauthorized"){ logout(); return null; }
    if(e.hard){ toast("⚠ "+e.message); return null; }
    NET=false; netPill(); queuePush({action,payload}); toast("⚠ "+t("offlineSync")); return null;
  }
}

}

function saleProfit(s){ return (s.items||[]).reduce((a,i)=>a+(num(i.price)-num(i.cost))*num(i.qty),0) - num(s.discount); }
function jobPartsProfit(j){ return num(j.parts_total)-num(j.discount)-num(j.parts_cost); }
function itemsCount(arr,it){ return (arr||[]).reduce((a,x)=>a+num(x[it]||0),0); }
function esc2(x){ return esc(x); }
/* CSV export (browser download) */
function exportCSV(filename, header, rows){
  const line=a=>a.map(v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',');
  const csv=[line(header)].concat(rows.map(line)).join('\n');
  const blob=new Blob(["﻿"+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },200);
}

/* ============ DASHBOARD ============ */
let dashPeriod="month";  // "month" | "all"
function setDashPeriod(p){ dashPeriod=p; render(); }
function vDash(){
  const ym=ymNow(), all=dashPeriod==="all";
  const inP=r=> all || rowYM(r)===ym;
  const fSales=sales.filter(inP), fJobs=jobs.filter(inP), fExp=expenses.filter(inP), fKhar=kharadia.filter(inP);
  const closedJobs=fJobs.filter(j=>j.status==='closed');
  // parts
  const soldQty = fSales.reduce((a,s)=>a+itemsCount(s.items,'qty'),0) + closedJobs.reduce((a,j)=>a+itemsCount(j.parts,'qty'),0);
  const saleVal = fSales.reduce((a,s)=>a+num(s.total),0) + closedJobs.reduce((a,j)=>a+(num(j.parts_total)-num(j.discount)),0);
  const partsProfit = fSales.reduce((a,s)=>a+saleProfit(s),0) + closedJobs.reduce((a,j)=>a+jobPartsProfit(j),0);
  // workshop
  const labour = closedJobs.reduce((a,j)=>a+num(j.labour),0);
  const activeJobs = jobs.filter(j=>j.status==='open').length;
  // kharadia
  const kPaid=fKhar.reduce((a,k)=>a+num(k.paid_out),0), kChg=fKhar.reduce((a,k)=>a+num(k.charged),0);
  // expenses + salaries
  const genExp=fExp.reduce((a,e)=>a+num(e.amt),0);
  const salPaid=empLedger.filter(l=>l.kind==='salary'&&inP(l)).reduce((a,l)=>a+num(l.amt),0);
  const totalExp=genExp+salPaid;
  const revenue=saleVal+labour+kChg;
  const net=partsProfit+labour+(kChg-kPaid)-totalExp;

  const pd='<div class="lang-switch" style="display:inline-flex"><button class="'+(dashPeriod==='month'?'on':'')+'" onclick="setDashPeriod(\'month\')">'+t("thisMonth")+'</button><button class="'+(dashPeriod==='all'?'on':'')+'" onclick="setDashPeriod(\'all\')">'+t("allTime")+'</button></div>';
  let h=pageHead("dashboard", (all?t("allTime"):new Date().toLocaleDateString("en-GB",{month:'long',year:'numeric'})), pd);

  h+='<h3 style="margin:6px 0 12px;font-weight:800">'+t("parts_overview")+'</h3><div class="stats">'
    +statCard2("blue",IC.sale,t("partsSold"),num(soldQty).toLocaleString('en-PK')+' qty','Direct + service')
    +statCard2("green",IC.cash,t("saleValue"),rs(saleVal))
    +statCard2("amber",IC.parts,t("partsProfit"),rs(partsProfit),'After cost')
    +statCard2("rose",IC.wrench,t("totalLabour"),rs(labour))
    +'</div>';
  h+='<h3 style="margin:6px 0 12px;font-weight:800">'+t("mech_overview")+' · '+t("kharadia")+'</h3><div class="stats">'
    +statCard2("blue",IC.service,t("activeJobs"),String(activeJobs)+' '+t("open"))
    +statCard2("green",IC.kharadia,t("kharadia")+' '+t("netProfit"),rs(kChg-kPaid),t("charged")+' '+rs(kChg))

/* ============ PARTS / STOCK ============ */
let fParts={q:"",model:"",stock:""};
function partsFiltered(){
  const q=fParts.q.toLowerCase();
  return parts.filter(p=>{
    if(q && !((p.name||"").toLowerCase().includes(q)||(p.code||"").toLowerCase().includes(q)||(p.nick||"").toLowerCase().includes(q))) return false;
    if(fParts.model && p.model!==fParts.model) return false;
    if(fParts.stock){ const c=stockCls(p); if(fParts.stock==="in"&&c==="out")return false; if(fParts.stock==="low"&&c!=="low")return false; if(fParts.stock==="out"&&c!=="out")return false; }
    return true;
  });
}
function partsRows(list){
  if(!list.length) return '<tr><td colspan="8" class="placeholder">'+t("noData")+'</td></tr>';
  return list.map(p=>'<tr><td><b>'+esc(p.name)+'</b>'+(p.nick?'<div class="lk-s">'+esc(p.nick)+'</div>':'')+'</td>'
    +'<td>'+esc(p.model||'—')+'</td><td class="num" style="color:var(--text-3)">'+esc(p.code||'—')+'</td><td>'+esc(p.loc||'—')+'</td>'
    +'<td>'+pill(stockCls(p),num(p.stock))+'</td><td class="num">'+rs(p.cost)+'</td><td class="num" style="color:var(--success)">'+rs(p.price)+'</td>'
    +'<td class="num">'+rs(num(p.stock)*num(p.cost))+'</td>'
    +'<td><button class="icon-btn" style="width:34px;height:34px" onclick="partEdit('+p.id+')">'+IC.edit+'</button> <button class="icon-btn" style="width:34px;height:34px" onclick="partDel('+p.id+')">'+IC.trash+'</button></td></tr>').join('');
}
function partsRefresh(){

let purMode="list", purCart=[], purMeta={supp:"",inv:"",date:"",notes:"",paid:0,inc:0};
function vPurchases(){ return purMode==="new"? purBuilder() : purList(); }
function purList(){
  const totAmt=purchases.reduce((a,p)=>a+num(p.amount),0);
  const bal=purchases.reduce((a,p)=>a+(num(p.amount)-num(p.paid)-num(p.incentive_used)),0);

    +statCard2("rose",IC.cash,t("balance")+' '+t("payable"),rs(bal))+'</div>';
  h+='<div class="card"><div class="tbl-wrap"><table><thead><tr><th>PO #</th><th>'+t("supplier")+'</th><th>'+t("date")+'</th><th>'+t("status")+'</th><th>'+t("amount")+'</th><th>'+t("payable")+'</th><th></th></tr></thead><tbody>'
    +(purchases.length?purchases.map(p=>{ const due=num(p.amount)-num(p.paid)-num(p.incentive_used); return '<tr><td><b>'+esc(p.po)+'</b><div class="lk-s">'+(p.items?p.items.length:0)+' items</div></td><td>'+esc(p.supp_name||'—')+(p.inv_no?'<div class="lk-s">INV# '+esc(p.inv_no)+'</div>':'')+'</td><td>'+esc(p.date||dstr(p.ts))+'</td><td>'+pill(p.status==='received'?'ok':(p.status==='partial'?'low':'out'),p.status)+'</td><td class="num">'+rs(p.amount)+'</td><td class="num" style="color:'+(due>0?'var(--danger)':'var(--success)')+'">'+rs(due)+'</td>'
      +'<td><button class="icon-btn" style="width:34px;height:34px" onclick="purDel('+p.id+')">'+IC.trash+'</button></td></tr>'; }).join('')
      :'<tr><td colspan="7" class="placeholder">'+t("noData")+'</td></tr>')
    +'</tbody></table></div></div>';
  return h;
}
function purNew(){ purMode="new"; purCart=[]; purMeta={supp:"",inv:"",date:todayD(),notes:"",paid:0,inc:0}; render(); }
function purBuilder(){
  let h=pageHead("newPurchase", t("newPurchase"), '<button class="btn btn-ghost" onclick="purMode=\'list\';render()">'+t("cancelL")+'</button>');
  h+='<div class="pos"><div>';
  h+='<div class="card" style="padding:18px 20px;margin-bottom:16px"><div class="fgrid">'
    +'<div><label>'+t("supplier")+'</label><select class="input" id="puSupp"><option value="">—</option>'+suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div>'
    +'<div><label>'+t("suppInvoice")+'</label><input class="input" id="puInv" value="'+esc(purMeta.inv)+'"></div>'
    +'<div><label>'+t("date")+'</label><input class="input" type="date" id="puDate" value="'+esc(purMeta.date)+'"></div>'
    +'</div><div style="margin-top:12px"><label style="font-size:.78rem;color:var(--text-2)">'+t("notes")+'</label><input class="input" id="puNotes" value="'+esc(purMeta.notes)+'"></div></div>';
  h+='<div class="card" style="padding:18px 20px"><h3 style="margin:0 0 12px">'+t("addL")+' '+t("parts")+'</h3>'+pickerHTML('pu','purAdd')+'<div style="margin-top:14px" id="puCartWrap">'+purCartHTML()+'</div></div>';
  h+='</div><div><div class="card" style="padding:20px"><h3 style="margin:0 0 14px">'+t("total")+'</h3>'
    +'<div class="totrow"><span>'+t("amount")+'</span><span class="num" id="puTot">Rs 0</span></div>'
    +'<div class="totrow"><span>'+t("paidNow")+'</span><input class="input num" type="number" id="puPaid" value="0" style="max-width:130px" oninput="purTotals()"></div>'
    +'<div class="totrow big"><span>'+t("payable")+'</span><span class="num" id="puDue">Rs 0</span></div>'
    +'<button class="btn btn-primary btn-block btn-lg" style="margin-top:14px" onclick="purSave()">'+t("savePurchase")+'</button></div></div></div>';
  return h;
}
function purCartHTML(){
  if(!purCart.length) return '<div class="placeholder" style="padding:30px">'+t("noData")+'</div>';
  return '<div class="tbl-wrap"><table class="cart-tbl"><thead><tr><th>'+t("partName")+'</th><th>'+t("qty")+'</th><th>'+t("price")+'</th><th>'+t("total")+'</th><th></th></tr></thead><tbody>'
    +purCart.map((c,i)=>'<tr><td>'+esc(c.name)+'</td><td><input type="number" value="'+c.qty+'" onchange="purCart['+i+'].qty=num(this.value);purTotals()"></td><td><input type="number" value="'+c.price+'" onchange="purCart['+i+'].price=num(this.value);purTotals()"></td><td class="num">'+rs(c.qty*c.price)+'</td><td><button class="icon-btn" style="width:30px;height:30px" onclick="purCart.splice('+i+',1);purCartRender()">'+IC.trash+'</button></td></tr>').join('')
    +'</tbody></table></div>';
}
function purCartRender(){ const w=document.getElementById("puCartWrap"); if(w)w.innerHTML=purCartHTML(); purTotals(); }
function purAdd(id){ const p=partById(id); if(!p)return; const ex=purCart.find(c=>c.part_id===id); if(ex)ex.qty+=1; else purCart.push({part_id:id,name:p.name,qty:1,price:num(p.cost)||num(p.price)}); clearPicker('pu'); purCartRender(); }
function purTotals(){ const amt=purCart.reduce((a,c)=>a+c.qty*c.price,0); const paid=mnum("puPaid");
  const tt=document.getElementById("puTot"); if(tt)tt.textContent=rs(amt);
  const du=document.getElementById("puDue"); if(du)du.textContent=rs(amt-paid); }
function purSave(){
  if(!purCart.length){ toast("⚠ "+t("addL")); return; }
  const amt=purCart.reduce((a,c)=>a+c.qty*c.price,0); const paid=mnum("puPaid");
  const supp=mval("puSupp"); const sObj=supp?byId(suppliers,Number(supp)):null;
  const payload={supp_id:supp||"",supp_name:sObj?sObj.name:"",inv_no:mval("puInv"),date:mval("puDate"),notes:mval("puNotes"),amount:amt,paid,incentive_used:0,status:"received",ts:Date.now(),items:purCart.map(c=>({part_id:c.part_id,part_name:c.name,qty:c.qty,price:c.price}))};
  cloudAction('purchase',payload).then(r=>{
    if(r&&(r.id||r.po)){
      purCart.forEach(c=>{ const p=partById(c.part_id); if(p){ p.stock=num(p.stock)+c.qty; if(c.price>0)p.cost=c.price; } });
      if(sObj){ sObj.bal=num(sObj.bal)+(amt-paid); }
      purchases.unshift({id:r.id,po:r.po,...payload}); persist(); toast(t("savedOk")+" "+(r.po||''));
      purMode="list"; render();
    } else if(r&&r.error) toast("⚠ "+r.error);
  });

/* ============ MECHANICS ============ */
function mechStats(m){
  const mj=jobs.filter(j=>String(j.mech_id)===String(m.id)&&j.status==='closed');
  const labour=mj.reduce((a,j)=>a+num(j.labour),0);
  const wage=labour*num(m.commission)/100;
  const settled=mechLedger.filter(l=>String(l.mech_id)===String(m.id)&&l.kind==='settle').reduce((a,l)=>a+num(l.amt),0);
  const adv=mechLedger.filter(l=>String(l.mech_id)===String(m.id)&&l.kind==='advance').reduce((a,l)=>a+num(l.amt),0);
  const rec=mechLedger.filter(l=>String(l.mech_id)===String(m.id)&&l.kind==='recover').reduce((a,l)=>a+num(l.amt),0);
  return {jobs:mj.length,labour,wage,settled,pending:wage-settled,advOut:adv-rec};
}

  h+='<div class="card"><div class="tbl-wrap"><table><thead><tr><th>'+t("date")+'</th><th>'+t("nameL")+'</th><th>'+t("category")+'</th><th>'+t("amount")+'</th><th></th></tr></thead><tbody>'
    +(expenses.length?expenses.map(e=>'<tr><td>'+esc(e.date||dstr(e.ts))+'</td><td><b>'+esc(e.title||'—')+'</b></td><td>'+pill('ok',e.cat||'General')+'</td><td class="num">'+rs(e.amt)+'</td>'
      +'<td><button class="icon-btn" style="width:32px;height:32px" onclick="expEdit('+e.id+')">'+IC.edit+'</button> <button class="icon-btn" style="width:32px;height:32px" onclick="expDel('+e.id+')">'+IC.trash+'</button></td></tr>').join('')

function expPayload(){ return {title:mval("xTitle"),cat:mval("xCat"),amt:mnum("xAmt"),date:mval("xDate")}; }
function expAdd(){ openModal(t("addExpense"),expForm(),()=>{ const p=expPayload(); if(!p.title||!p.amt){toast("⚠");return false;}
  cloudAction('expense.add',p).then(r=>{ if(r&&r.id){ expenses.unshift({id:r.id,...p,ts:Date.now()}); persist(); render(); toast(t("savedOk")); } }); }); }
function expEdit(id){ const e=byId(expenses,id); if(!e)return; openModal(t("editL"),expForm(e),()=>{ const d=expPayload(); Object.assign(e,d); persist(); cloudAction('expense.update',{id,...d}); render(); toast(t("savedOk")); }); }
function expDel(id){ const e=byId(expenses,id); if(!e)return; if(!confirm(t("deleteL")+"?"))return; expenses=expenses.filter(x=>x.id!==id); persist(); cloudAction('expense.delete',{id}); render(); toast(t("deletedOk")); }

/* ============ REPORTS ============ */
function vReports(){
  const closed=jobs.filter(j=>j.status==='closed');
  const saleRev=sales.reduce((a,s)=>a+num(s.total),0);
  const jobParts=closed.reduce((a,j)=>a+(num(j.parts_total)-num(j.discount)),0);
  const labour=closed.reduce((a,j)=>a+num(j.labour),0);
  const kNet=kharadia.reduce((a,k)=>a+num(k.charged)-num(k.paid_out),0);
  const partsProfit=sales.reduce((a,s)=>a+saleProfit(s),0)+closed.reduce((a,j)=>a+jobPartsProfit(j),0);
  const genExp=expenses.reduce((a,e)=>a+num(e.amt),0);
  const salPaid=empLedger.filter(l=>l.kind==='salary').reduce((a,l)=>a+num(l.amt),0);
  const totExp=genExp+salPaid;
  const revenue=saleRev+jobParts+labour+kharadia.reduce((a,k)=>a+num(k.charged),0);
  const net=partsProfit+labour+kNet-totExp;
  let h=pageHead("reports","All-time summary");
  h+='<div class="stats">'+statCard2("green",IC.reports,t("revenue"),rs(revenue))+statCard2("rose",IC.expenses,t("totalExpenses"),rs(totExp))+statCard2((net>=0?"green":"rose"),IC.cash,t("netProfit"),rs(net))+statCard2("blue",IC.parts,t("partsProfit"),rs(partsProfit))+'</div>';
  h+='<div class="stats">'+statCard2("amber",IC.wrench,t("totalLabour"),rs(labour))+statCard2("blue",IC.kharadia,t("kharadia")+' '+t("netProfit"),rs(kNet))+statCard2("green",IC.sale,t("sales"),rs(saleRev),sales.length+' inv')+statCard2("amber",IC.expenses,'Salaries',rs(salPaid))+'</div>';
  // monthly breakdown (last 6 months)
  const months=[]; const d=new Date(); for(let i=0;i<6;i++){ months.push(new Date(d.getFullYear(),d.getMonth()-i,1).toISOString().slice(0,7)); }
  h+='<div class="card"><div class="card-head"><h3>📊 Monthly</h3></div><div class="tbl-wrap"><table><thead><tr><th>Month</th><th>'+t("sales")+'</th><th>'+t("labour")+'</th><th>'+t("expenses")+'</th><th>'+t("netProfit")+'</th></tr></thead><tbody>'
    +months.map(ym=>{ const sRev=sales.filter(s=>rowYM(s)===ym).reduce((a,s)=>a+num(s.total),0);
      const sPr=sales.filter(s=>rowYM(s)===ym).reduce((a,s)=>a+saleProfit(s),0);
      const cl=closed.filter(j=>rowYM(j)===ym); const lab=cl.reduce((a,j)=>a+num(j.labour),0); const jPr=cl.reduce((a,j)=>a+jobPartsProfit(j),0);
      const ex=expenses.filter(e=>rowYM(e)===ym).reduce((a,e)=>a+num(e.amt),0)+empLedger.filter(l=>l.kind==='salary'&&l.month===ym).reduce((a,l)=>a+num(l.amt),0);
      const nt=sPr+jPr+lab-ex;
      return '<tr><td><b>'+ym+'</b></td><td class="num">'+rs(sRev)+'</td><td class="num">'+rs(lab)+'</td><td class="num">'+rs(ex)+'</td><td class="num" style="color:'+(nt>=0?'var(--success)':'var(--danger)')+'"><b>'+rs(nt)+'</b></td></tr>'; }).join('')
    +'</tbody></table></div></div>';
  return h;
}

    +'<div><label>'+t("phone")+'</label><input class="input" id="shPhone" value="'+esc(shopInfo.phone)+'"'+(isOwner?'':' disabled')+'></div>'
    +'<div><label>'+t("address")+'</label><input class="input" id="shAddr" value="'+esc(shopInfo.address)+'"'+(isOwner?'':' disabled')+'></div></div>'

      +users.map(u=>'<tr><td><b>'+esc(u.u)+'</b></td><td>'+esc(u.name||"")+'</td><td><span class="badge-role '+(u.role==="owner"?"owner":"cashier")+'">'+esc(u.role)+'</span></td>'
        +'<td><button class="btn btn-ghost" style="padding:6px 11px;font-size:.78rem" onclick="userEdit('+u.id+')">✎</button>'+(u.role!=="owner"?' <button class="rm" onclick="userDel('+u.id+')">'+IC.trash+'</button>':'')+'</td></tr>').join("")
      +'</tbody></table></div></div>';
  }
  h+='<div class="card" style="margin-bottom:14px;padding:20px 22px"><div class="card-head" style="padding:0 0 14px;border:0"><h3>🔑 '+t("myPass")+'</h3></div><div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:180px"><label>'+t("newPass")+'</label><input class="input" type="text" id="myPass"></div>'
    +'<button class="btn btn-primary" onclick="changeMyPass()">'+t("saveL")+'</button></div></div>';
  if(isOwner){
    h+='<div class="card" style="margin-bottom:14px;padding:20px 22px;border-color:var(--danger)"><div class="card-head" style="padding:0 0 10px;border:0"><h3 style="color:var(--danger)">⚠ '+t("dangerZone")+'</h3></div>'
      +'<p style="color:var(--text-2);font-size:.86rem;margin:0 0 12px">'+t("resetNote")+'</p>'
      +'<button class="btn btn-ghost" style="color:var(--danger)" onclick="if(confirm(t(\'resetConfirm\'))&&confirm(\'100%?\')) resetData()">'+t("resetData")+'</button></div>';
  }
  return h;

function saveShop(){
  shopInfo.name=mval("shName")||shopInfo.name; shopInfo.tagline=mval("shTag"); shopInfo.phone=mval("shPhone"); shopInfo.address=mval("shAddr");
  persist(); cloudAction('shop.update',{name:shopInfo.name,tagline:shopInfo.tagline,phone:shopInfo.phone,address:shopInfo.address});
  brandRefresh(); render(); toast(t("savedOk"));
}
function userAdd(){
  openModal(t("newLogin"),'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>'+t("username")+' *</label><input class="input" id="uU"></div><div><label>'+t("password")+' *</label><input class="input" id="uP"></div>'
    +'<div><label>'+t("nameL")+'</label><input class="input" id="uN"></div><div><label>'+t("role")+'</label><select class="input" id="uR"><option value="cashier">cashier</option><option value="owner">owner</option></select></div></div>',
    ()=>{ const un=mval("uU"), pw=mval("uP"); if(!un||!pw){ toast("⚠"); return false; }
      cloudAction('user.add',{username:un,password:pw,name:mval("uN")||un,role:document.getElementById("uR").value}).then(r=>{
        if(r&&r.id){ users.push({id:r.id,u:un,name:mval("uN")||un,role:document.getElementById("uR").value}); persist(); render(); toast(t("savedOk")); }
        else if(r&&r.error) toast("⚠ "+r.error); });
      });
}
function userEdit(id){
  const u=users.find(x=>x.id===id); if(!u) return;
  openModal(t("editL")+" — "+u.u,'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>'+t("nameL")+'</label><input class="input" id="uN" value="'+esc(u.name||"")+'"></div>'
    +'<div><label>'+t("role")+'</label><select class="input" id="uR"><option value="cashier"'+(u.role==="cashier"?" selected":"")+'>cashier</option><option value="owner"'+(u.role==="owner"?" selected":"")+'>owner</option></select></div>'
    +'<div style="grid-column:1/-1"><label>'+t("newPass")+'</label><input class="input" id="uP"></div></div>',
    ()=>{ u.name=mval("uN"); u.role=document.getElementById("uR").value;
      cloudAction('user.update',{id:u.id,name:u.name,role:u.role,password:mval("uP")||undefined});
      persist(); render(); toast(t("savedOk")); });
}
function userDel(id){
  const u=users.find(x=>x.id===id); if(!u) return;
  if(!confirm(u.u+" — "+t("deleteL")+"?")) return;
  users=users.filter(x=>x.id!==id); persist(); cloudAction('user.delete',{id}); render(); toast(t("deletedOk"));
}
function changeMyPass(){
  const p=mval("myPass"); if(!p){ toast("⚠"); return; }
  cloudAction('password.change',{password:p}); document.getElementById("myPass").value="";
  toast(t("savedOk"));
}

function rcHead(){ return '<div class="rc-center"><div class="rc-shop">'+esc(shopInfo.name)+'</div><div>'+esc(shopInfo.tagline||"")+'</div><div>'+esc(shopInfo.phone||"")+'</div><div>'+esc(shopInfo.address||"")+'</div></div><div class="rc-line"></div>'; }

function doPrint(html){ const pa=document.getElementById("receiptArea"); pa.innerHTML=html; setTimeout(()=>window.print(),80); }

/* ============ auth / boot ============ */
function brandRefresh(){
  const initials=(shopInfo.name||"NG").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  document.querySelectorAll(".bb,.brand-badge").forEach(el=>el.textContent=initials);
  const bt=document.getElementById("brandTitle"); if(bt) bt.textContent=shopInfo.name;
  const bl=document.getElementById("brandTitleLogin"); if(bl) bl.textContent=shopInfo.name;
  const sn=document.getElementById("shopName"); if(sn) sn.textContent=shopInfo.tagline||"";
  const uc=document.querySelector("#userChip .un"); if(uc&&currentUser) uc.textContent=currentUser.name||currentUser.u;
  const us=document.querySelector("#userChip .us"); if(us&&currentUser) us.textContent=currentUser.role;
  const av=document.querySelector("#userChip .avatar"); if(av&&currentUser) av.textContent=(currentUser.u||"U")[0].toUpperCase();
}
async function doLogin(){
  const err=document.getElementById("lgErr"); err.classList.remove("show");
  const u=mval("lgUser"), p=document.getElementById("lgPass").value;
  if(!u||!p){ err.textContent=t("username")+" / "+t("password"); err.classList.add("show"); return; }
  try{
    const j=await cloudLogin(u,p);
    currentUser={u:j.user.username, name:j.user.name, role:j.user.role};
    await enter();
  }catch(e){ err.textContent=e.message==="unauthorized"?"✗ "+t("username")+" / "+t("password"):e.message; err.classList.add("show"); }
}
function logout(){
  TOKEN=null; currentUser=null;
  try{ localStorage.removeItem("hw_token"); localStorage.removeItem("hw_me"); }catch(e){}
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
}
async function enter(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  loadDB();
  try{ await cloudBootstrap(); }catch(e){
    if(e.message==="unauthorized"){ logout(); return; }
    if(e.hard){ logout(); alert(e.message); return; }
    NET=false; toast("⚠ "+t("offlineTag"));
  }
  flushQueue();
  route="dashboard";
  brandRefresh(); buildNav(); render();
}
document.getElementById("lgPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("lgUser").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("lgPass").focus(); });
document.getElementById("lgBtn").addEventListener("click",doLogin);
document.getElementById("appTheme").addEventListener("click",toggleTheme);
document.getElementById("loginTheme").addEventListener("click",toggleTheme);
document.getElementById("navSettings").addEventListener("click",()=>go("settings"));
document.getElementById("menuBtn").addEventListener("click",()=>{ document.getElementById("sidebar").classList.add("open"); const sc=document.createElement("div"); sc.className="scrim"; sc.onclick=()=>{document.getElementById("sidebar").classList.remove("open");sc.remove();}; document.body.appendChild(sc); });
window.addEventListener("online",()=>{ NET=true; netPill(); flushQueue(); });
window.addEventListener("offline",()=>{ NET=false; netPill(); });
(function init(){
  applyTheme(localStorage.getItem("hw_theme")||"dark");
  applyLang(lang);
  if(TOKEN){
    let me=null; try{ me=JSON.parse(localStorage.getItem("hw_me")||"null"); }catch(e){}
    if(me){ currentUser={u:me.username,name:me.name,role:me.role}; enter(); }
    else logout();
  }
})();
</script>
